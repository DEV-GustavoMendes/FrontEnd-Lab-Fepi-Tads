<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
    <link rel="stylesheet" href="styles/forms-style.css">
</head>
<body>
    <h1>Faça seu Cadastro</h1>
    <h2>Faça seu Cadastro</h2>
    <h2>Compra Online</h2>
    <form>
        <fieldset>
            <legend>Faça seu Cadastro</legend>
            <div class="field">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="field">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="field">
                <label for="data-nascimento">Data de Nascimento:</label>
                <input type="date" id="data-nascimento" name="data-nascimento" required>
            </div>
            <div class="field">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" required>
            </div>
        </fieldset>
        <fieldset>
            <legend>Endereço</legend>
            <div class="address-grid">
                <div class="field">
                    <label for="rua">Rua:</label>
                    <input type="text" id="rua" name="rua" required>
                </div>
                <div class="field">
                    <label for="numero">Número:</label>
                    <input type="text" id="numero" name="numero" required>
                </div>
                <div class="field">
                    <label for="bairro">Bairro:</label>
                    <input type="text" id="bairro" name="bairro" required>
                </div>
                <div class="field">
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" required>
                </div>
                <div class="field">
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required>
                </div>
                <div class="field">
                    <label for="estado">Estado:</label>
                    <input type="text" id="estado" name="estado" required>
                </div>
            </div>
        </fieldset>
        <fieldset>
            <legend>Login</legend>
            <div class="field">
                <label for="login">Login:</label>
                <input type="text" id="login" name="login" required>
            </div>
            <div class="field">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </div>
            <div class="field">
                <label for="confirmacao-senha">Confirmação de Senha:</label>
                <input type="password" id="confirmacao-senha" name="confirmacao-senha" required>
            </div>
        </fieldset>
        <div class="buttons">
            <button type="submit">Enviar</button>
            <button type="reset">Cancelar</button>
        </div>
    </form>
</body>
</html>
