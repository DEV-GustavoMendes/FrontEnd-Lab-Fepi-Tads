<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <link rel="stylesheet" href="styles/cards.css">
</head>
<body>

    <section class="pricing-container">
        <article class="pricing-card">
            <h2>Gratuito</h2>
            <div class="price">R$<span>0</span>/mês</div>
            <ul class="features">
                <li>1 usuário</li>
                <li>3 contas de design</li>
                <li>Suporte por e-mail</li>
            </ul>
            <button class="btn-plan">Escolher plano</button>
        </article>

        <article class="pricing-card featured">
            <h2>Elite</h2>
            <div class="price">R$<span>99</span>/mês</div>
            <ul class="features">
                <li>Usuários ilimitados</li>
                <li>10 contas de design</li>
                <li>100 implantações</li>
                <li>Suporte 24h por dia</li>
            </ul>
            <button class="btn-plan">Escolher plano</button>
        </article>

        <article class="pricing-card">
            <h2>Profissional</h2>
            <div class="price">R$<span>49</span>/mês</div>
            <ul class="features">
                <li>100 usuários</li>
                <li>3 contas de design</li>
                <li>Suporte por e-mail</li>
            </ul>
            <button class="btn-plan">Escolher plano</button>
        </article>
    </section>

</body>
</html>
